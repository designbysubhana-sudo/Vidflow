<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>VidFlow - Login</title>
  <link rel="stylesheet" href="login.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
</head>
<body>

  <div class="auth-container">

    <div class="auth-logo">
      <div class="logo-icon">▶</div>
      <h1>VidFlow</h1>
    </div>

    <!-- LOGIN CARD -->
    <div class="auth-card" id="loginCard">

      <h2>Welcome back</h2>

      <p class="subtitle">
        Login to continue to VidFlow
      </p>

      <form id="loginForm">

        <label for="loginEmail">Email</label>
        <input
          type="email"
          id="loginEmail"
          placeholder="Enter your email"
          required
        >

        <label for="loginPassword">Password</label>
        <input
          type="password"
          id="loginPassword"
          placeholder="Enter your password"
          required
        >

        <p class="error-message" id="loginError"></p>

        <button
          type="submit"
          class="primary-button"
        >
          Login
        </button>

      </form>

      <p class="switch-text">
        Don't have an account?
        <button id="openSignup" type="button">
          Create Account
        </button>
      </p>

    </div>


    <!-- SIGN UP CARD -->
    <div class="auth-card hidden" id="signupCard">

      <h2>Create your account</h2>

      <p class="subtitle">
        Start managing your content with VidFlow
      </p>

      <form id="signupForm">

        <label for="signupName">Name</label>
        <input
          type="text"
          id="signupName"
          placeholder="Your name"
          required
        >

        <label for="signupEmail">Email</label>
        <input
          type="email"
          id="signupEmail"
          placeholder="Enter your email"
          required
        >

        <label for="signupPassword">Password</label>
        <input
          type="password"
          id="signupPassword"
          placeholder="Create password"
          minlength="6"
          required
        >

        <label for="confirmPassword">Confirm Password</label>
        <input
          type="password"
          id="confirmPassword"
          placeholder="Confirm password"
          minlength="6"
          required
        >

        <p class="error-message" id="signupError"></p>

        <button
          type="submit"
          class="primary-button"
        >
          Create Account
        </button>

      </form>

      <p class="switch-text">
        Already have an account?
        <button id="openLogin" type="button">
          Login
        </button>
      </p>

    </div>

  </div>

  <script src="login.js"></script>

</body>
</html>
